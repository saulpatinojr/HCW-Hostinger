name: VPS Diagnostics

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Write SSH private key
        # $RUNNER_TEMP is mounted into the appleboy/ssh-action container as
        # /github/runner_temp. The action container runs as a different UID
        # than the host runner user, so the file must be world-readable.
        # Safe: $RUNNER_TEMP is job-scoped and destroyed at job end.
        run: |
          echo "${{ secrets.VPS_SSH_KEY }}" | base64 -d > "$RUNNER_TEMP/vps_key"
          chmod 644 "$RUNNER_TEMP/vps_key"

      - name: VPS State Report
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_SSH_HOST }}
          username: ${{ secrets.VPS_SSH_USERNAME }}
          key_path: /github/runner_temp/vps_key
          script: |
            echo "====== SYSTEM ======"
            uname -a
            uptime
            echo ""

            echo "====== RESOURCES ======"
            df -h
            echo ""
            free -h
            echo ""

            echo "====== DOCKER ======"
            docker --version 2>/dev/null || echo "Docker not installed"
            docker compose version 2>/dev/null || echo "Docker Compose not installed"
            echo ""
            docker ps -a 2>/dev/null || echo "Docker not running"
            echo ""

            echo "====== GITHUB RUNNER ======"
            RUNNER_UNIT=$(systemctl list-units --type=service --all --no-legend 'actions.runner*' 2>/dev/null | awk '{print $1}' | head -1)
            if [ -n "$RUNNER_UNIT" ]; then
              echo "Runner service is UP:"
              systemctl status --no-pager "$RUNNER_UNIT" || true
              echo ""
              echo "Recent runner logs:"
              journalctl -u "$RUNNER_UNIT" --no-pager --lines 20 2>&1 || true
            else
              echo "Runner service not found or not running"
              echo "All runner-related services:"
              systemctl list-units --type=service --all | grep actions.runner || true
            fi
            echo ""

            echo "====== VAULT ======"
            if systemctl list-unit-files | grep -q '^vault.service'; then
              systemctl status --no-pager vault.service || true
              echo ""
              echo "Vault health endpoint:"
              curl -s http://127.0.0.1:8200/v1/sys/health || true
            else
              echo "Vault service not found"
            fi
            echo ""

            echo "====== PORTAINER ======"
            PORTAINER_ID=$(docker ps -q --filter "name=portainer" 2>/dev/null | head -1)
            if [ -n "$PORTAINER_ID" ]; then
              echo "Portainer container is UP:"
              docker ps --filter "name=portainer" --format "table {{.Names}}\t{{.Status}}\t{{.Image}}"
              echo ""
              echo "Access via SSH tunnel: ssh -L 9443:localhost:9443 <user>@<vps_ip> -N"
              echo "Then open: https://localhost:9443"
            else
              echo "Portainer container not found or not running"
            fi
            echo ""

            echo "====== RUSTDESK ======"
            RUSTDESK_IDS=$(docker ps -q --filter "name=rustdesk" 2>/dev/null)
            if [ -n "$RUSTDESK_IDS" ]; then
              docker ps --filter "name=rustdesk" --format "table {{.Names}}\t{{.Status}}\t{{.Image}}"
              echo ""
              echo "Public key (clients must be configured with this):"
              cat /var/lib/docker/volumes/rustdesk_data/_data/id_ed25519.pub 2>/dev/null \
                || echo "Keypair not generated yet"
            else
              echo "RustDesk containers not found or not running"
            fi
            echo ""

            echo "====== NETWORK ======"
            echo "-- listening (tcp) --"
            ss -tlnp | grep -E ':(22|80|443|9443|8200|2111[5-9])\b' || true
            echo "-- listening (udp) --"
            ss -ulnp | grep -E ':21116\b' || true
            echo ""
            echo "-- ufw --"
            ufw status verbose 2>/dev/null || echo "ufw not available"
