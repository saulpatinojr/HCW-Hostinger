name: VPS Diagnostics

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Write SSH private key
        # $RUNNER_TEMP is mounted into the appleboy/ssh-action container as
        # /github/runner_temp. The action container runs as a different UID
        # than the host runner user, so the file must be world-readable.
        # Safe: $RUNNER_TEMP is job-scoped and destroyed at job end.
        run: |
          echo "${{ secrets.VPS_SSH_KEY }}" | base64 -d > "$RUNNER_TEMP/vps_key"
          chmod 644 "$RUNNER_TEMP/vps_key"

      - name: VPS State Report
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_SSH_HOST }}
          username: ${{ secrets.VPS_SSH_USERNAME }}
          key_path: /github/runner_temp/vps_key
          script: |
            echo "====== SYSTEM ======"
            uname -a
            uptime
            echo ""

            echo "====== RESOURCES ======"
            df -h
            echo ""
            free -h
            echo ""

            echo "====== DOCKER ======"
            docker --version 2>/dev/null || echo "Docker not installed"
            docker compose version 2>/dev/null || echo "Docker Compose not installed"
            echo ""
            docker ps -a 2>/dev/null || echo "Docker not running"
            echo ""

            echo "====== GITHUB RUNNER ======"
            RUNNER_ID=$(docker ps -q --filter "name=github-runner" 2>/dev/null | head -1)
            if [ -n "$RUNNER_ID" ]; then
              echo "Runner container is UP:"
              docker ps --filter "name=github-runner" --format "table {{.Names}}\t{{.Status}}\t{{.Image}}"
              echo ""
              echo "Recent runner logs:"
              docker logs --tail 20 "$RUNNER_ID" 2>&1
            else
              echo "Runner container not found or not running"
              echo "All containers:"
              docker ps -a 2>/dev/null || true
            fi
            echo ""

            echo "====== NETWORK ======"
            ss -tlnp | grep -E '80|443|22' || true
