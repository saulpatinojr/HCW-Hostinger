name: Multi-Environment Deploy

on:
  push:
    branches: [ main, staging ]
  workflow_dispatch:

# Cancel any in-flight run for the same branch so pushes don't queue
# up behind a stalled job waiting for a runner.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Set environment variables
        id: env
        run: |
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            echo "env_vars=NODE_ENV=production" >> $GITHUB_OUTPUT
          else
            echo "env_vars=NODE_ENV=staging" >> $GITHUB_OUTPUT
          fi

      - name: Deploy with Docker Compose
        run: |
          export ${{ steps.env.outputs.env_vars }}
          docker compose down || true
          docker compose up -d
          docker compose ps
