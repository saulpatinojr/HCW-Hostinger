name: Multi-Environment Deploy

on:
  push:
    branches: [ main, staging ]
  workflow_dispatch:

# Cancel any in-flight run for the same branch so pushes don't queue
# up behind a stalled job waiting for a runner.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    # Labelled, not bare `self-hosted`. Bare would match ANY runner on the VPS,
    # including ones registered for other repos — which is exactly what
    # docs/wiki/Deploying-to-the-VPS.md tells everyone else not to do.
    #
    # Requires an entry in `github_runners` whose labels include `hcw-deploy`.
    # On a freshly rebuilt VPS that runner does not exist yet, so this job will
    # sit queued until it does. See docs/REBUILD-RUNBOOK.md — the runner comes
    # before the first push to main.
    runs-on: [self-hosted, hcw-deploy]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Deploy with Docker Compose
        # Pull new images first, then recreate changed containers in place.
        # --remove-orphans cleans up containers for services removed from compose.
        # No `down` step means zero unnecessary downtime.
        env:
          NODE_ENV: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
        run: |
          docker compose pull
          docker compose up -d --remove-orphans
          docker compose ps
