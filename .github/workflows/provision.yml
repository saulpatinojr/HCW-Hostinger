name: Provision VPS

# Ansible only. This workflow used to run a Terraform job first, whose sole
# resource was a `local_file` writing the Ansible inventory — but the Ansible
# job runs on a separate runner with its own checkout and writes its own
# inventory from secrets, so Terraform's output was never read by anything.
# Its `vps_ip` output was likewise declared and never consumed. See ADR-0017.
#
# Vault's Terraform root (infrastructure/terraform/vault-config) manages real
# resources and keeps its own state; `Vault Config` is unaffected by this.

on:
  workflow_dispatch:
    inputs:
      ansible_tags:
        description: "Limit provisioning to these tags (comma-separated; blank = every role). e.g. rustdesk, portainer, runner, k3d"
        required: false
        default: ""
        type: string
      dry_run:
        description: "List the tasks that would run, and change nothing on the VPS"
        required: false
        default: false
        type: boolean

# Serialise runs. Two concurrent plays against one host fight over the apt
# lock, the Docker socket and compose projects. Queue rather than cancel — a
# cancelled run can leave the VPS half-built.
concurrency:
  group: provision-${{ github.ref }}
  cancel-in-progress: false

env:
  ANSIBLE_DIR: infrastructure/ansible

jobs:
  ansible:
    name: Ansible provision
    runs-on: ubuntu-latest
    # Generous: covers dist-upgrade + optional reboot wait (≤5 min) + all roles
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Write SSH private key
        run: |
          echo "${{ secrets.VPS_SSH_KEY }}" | base64 -d > /tmp/vps_key
          chmod 600 /tmp/vps_key

      - name: Generate Ansible inventory
        run: |
          mkdir -p ${{ env.ANSIBLE_DIR }}/inventory
          cat > ${{ env.ANSIBLE_DIR }}/inventory/hosts.yml << 'EOF'
          all:
            hosts:
              vps:
                ansible_host: ${{ secrets.VPS_SSH_HOST }}
                ansible_user: ${{ secrets.VPS_SSH_USERNAME }}
                ansible_ssh_common_args: "-o StrictHostKeyChecking=no"
          EOF

      - name: Install Ansible
        run: pip install --quiet ansible

      - name: Install Ansible collections
        run: ansible-galaxy collection install -r requirements.yml
        working-directory: ${{ env.ANSIBLE_DIR }}

      - name: Run playbook
        # Playbook is idempotent — safe to re-run at any point. If a
        # dist-upgrade requires a kernel reboot, Ansible reboots the VPS and
        # waits up to 5 minutes for SSH to recover before continuing.
        #
        # dry_run uses --list-tasks rather than --check: check mode is
        # unreliable across the command and docker_compose_v2 tasks this
        # playbook uses, and would report failures that mean nothing.
        # --list-tasks never connects to the host at all.
        env:
          ANSIBLE_TAGS: ${{ inputs.ansible_tags }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          ARGS=()
          if [ -n "$ANSIBLE_TAGS" ]; then
            ARGS+=(--tags "$ANSIBLE_TAGS")
            echo "Limiting provisioning to tags: $ANSIBLE_TAGS"
          fi
          if [ "$DRY_RUN" = "true" ]; then
            ARGS+=(--list-tasks)
            echo "Dry run — listing tasks only, the VPS will not be touched."
          fi

          ansible-playbook site.yml \
            --private-key /tmp/vps_key \
            "${ARGS[@]}" \
            -e "github_app_id=${{ secrets.GH_APP_ID }}" \
            -e "github_app_installation_id=${{ secrets.GH_APP_INSTALLATION_ID }}" \
            -e "github_app_private_key=${{ secrets.GH_APP_PRIVATE_KEY }}"
        working-directory: ${{ env.ANSIBLE_DIR }}
