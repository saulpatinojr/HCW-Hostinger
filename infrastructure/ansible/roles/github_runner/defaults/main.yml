---
# One compose project per runner, under a shared parent directory.
github_runner_base_dir: /opt/runners

# Pinned, not :latest — an unattended `docker compose pull` should never swap
# the runner out from under a running job.
github_runner_image: "myoung34/github-runner:2.336.0"

# ── Runner registry ──────────────────────────────────────────────────────────
# Every runner this VPS hosts. Adding a repo to the lab means adding an entry
# here and re-running with --tags runner; nothing is configured by hand.
#
# NAMING CONVENTION — <app>-<purpose>-runner
#
#   myapp-ci-runner          CI for myapp
#   myapp-deploy-runner      deploys for myapp
#   personalsite-ci-runner   CI for the personal site
#
# The name is used verbatim as the compose project AND the container name, so
# `docker ps` tells you which repo and which job a container belongs to without
# cross-referencing anything.
#
#   name:   <app>-<purpose>-runner  (lowercase, hyphens)
#   repo:   owner/repo the runner registers against
#   labels: comma-separated. Do NOT include `self-hosted` — GitHub adds it.
#           Give each runner a unique label so workflows can target it.
#
# Generate a correctly-formed entry with:  scripts/New-VpsRunner.ps1
#
# The GitHub App (github_app_id / github_app_private_key) must be installed on
# every repo listed here, or that runner fails to register and restart-loops.
#
# Left empty deliberately — fill in your own rather than inheriting someone
# else's. An empty list makes this role a no-op.
github_runners: []
#   - name: personalsite-ci-runner
#     repo: <owner>/<repo>
#     labels: "linux,personalsite-ci"

# ── Migration off hand-made compose projects ─────────────────────────────────
# Containers created before this role owned them. Removed only after a
# replacement in github_runners is confirmed running, and only when the list is
# non-empty — otherwise this would delete a working runner and put nothing back.
#
# Opt-in. Set true once the replacement entry above is filled in and applied.
github_runner_legacy_containers:
  - personal-site_hcw-runner-1
github_runner_remove_legacy: false
