---
- name: Update apt cache and dist-upgrade all packages
  ansible.builtin.apt:
    update_cache: true
    upgrade: dist
    cache_valid_time: 0    # always refresh — we want the very latest
    autoremove: true

- name: Check if a reboot is required after upgrade
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: _reboot_required

# Reboots the host, waits up to 5 minutes for SSH to come back, then
# resumes the play — equivalent to "stop, wait for VPS to reboot, continue".
- name: Reboot if OS upgrade requires it
  ansible.builtin.reboot:
    reboot_timeout: 300
    msg: "Rebooting after OS upgrade"
  when: _reboot_required.stat.exists

- name: Install base packages
  ansible.builtin.apt:
    name:
      - curl
      - git
      - jq
      - ufw
      - fail2ban
      - unattended-upgrades
      - ca-certificates
      - gnupg
    state: present

- name: Configure UFW defaults
  community.general.ufw:
    direction: "{{ item.direction }}"
    policy: "{{ item.policy }}"
  loop:
    - { direction: incoming, policy: deny }
    - { direction: outgoing, policy: allow }

- name: Allow base ports through UFW
  community.general.ufw:
    rule: allow
    port: "{{ item.port }}"
    proto: "{{ item.proto }}"
  loop: "{{ ufw_allowed_ports }}"
  loop_control:
    label: "{{ item.port }}/{{ item.proto }}"

- name: Enable UFW
  community.general.ufw:
    state: enabled

- name: Disable SSH password authentication
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?PasswordAuthentication"
    line: "PasswordAuthentication no"
    validate: sshd -t -f %s
  notify: Restart sshd

# ── Authorised keys ──────────────────────────────────────────────────────────
# The module owns line formatting, so a key can no longer be appended without a
# trailing newline and swallowed into the previous entry's comment — which is
# exactly what had happened to this host's authorized_keys.
- name: Install authorised SSH keys
  ansible.posix.authorized_key:
    user: "{{ ssh_authorized_user }}"
    key: "{{ item }}"
    state: present
  loop: "{{ ssh_authorized_keys }}"
  loop_control:
    label: "{{ item.split() | last }}"
  when: ssh_authorized_keys | length > 0

# Refuse to prune when the list is empty — an empty exclusive list would wipe
# every key on the host and lock SSH out entirely.
- name: Refuse to prune authorised keys against an empty list
  ansible.builtin.assert:
    that:
      - ssh_authorized_keys | length > 0
    fail_msg: >-
      ssh_authorized_keys_exclusive is true but ssh_authorized_keys is empty.
      That would remove every key and lock you out. Populate the list first.
  when: ssh_authorized_keys_exclusive | bool

# Consolidation step. Off by default: turn it on only once you have confirmed
# the keys above can log in, because it removes everything else. Recovery from
# a mistake here is via the Hostinger browser console.
- name: Prune authorised keys not in the managed list
  ansible.posix.authorized_key:
    user: "{{ ssh_authorized_user }}"
    key: "{{ ssh_authorized_keys | join('\n') }}"
    exclusive: true
  when:
    - ssh_authorized_keys_exclusive | bool
    - ssh_authorized_keys | length > 0
