---
- name: Update apt cache and dist-upgrade all packages
  ansible.builtin.apt:
    update_cache: true
    upgrade: dist
    cache_valid_time: 0    # always refresh — we want the very latest
    autoremove: true

- name: Check if a reboot is required after upgrade
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: _reboot_required

# Reboots the host, waits up to 5 minutes for SSH to come back, then
# resumes the play — equivalent to "stop, wait for VPS to reboot, continue".
- name: Reboot if OS upgrade requires it
  ansible.builtin.reboot:
    reboot_timeout: 300
    msg: "Rebooting after OS upgrade"
  when: _reboot_required.stat.exists

- name: Install base packages
  ansible.builtin.apt:
    name:
      - curl
      - git
      - jq
      - ufw
      - fail2ban
      - unattended-upgrades
      - ca-certificates
      - gnupg
    state: present

- name: Configure UFW defaults
  community.general.ufw:
    direction: "{{ item.direction }}"
    policy: "{{ item.policy }}"
  loop:
    - { direction: incoming, policy: deny }
    - { direction: outgoing, policy: allow }

- name: Allow SSH through UFW
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp

- name: Allow HTTP through UFW
  community.general.ufw:
    rule: allow
    port: "80"
    proto: tcp

- name: Allow HTTPS through UFW
  community.general.ufw:
    rule: allow
    port: "443"
    proto: tcp

- name: Enable UFW
  community.general.ufw:
    state: enabled

- name: Disable SSH password authentication
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?PasswordAuthentication"
    line: "PasswordAuthentication no"
    validate: sshd -t -f %s
  notify: Restart sshd
