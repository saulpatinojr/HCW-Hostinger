---
# ─────────────────────────────────────────────────────────────────────────────
# Host-level k3s — off by default (k3s_manage: false)
#
# Adopt-only when enabled: installs when absent, otherwise just asserts the
# service state. It never upgrades and never uninstalls, so enabling it against
# a host that already runs k3s is safe.
# ─────────────────────────────────────────────────────────────────────────────
- name: Check whether k3s is installed
  ansible.builtin.stat:
    path: /usr/local/bin/k3s
  register: _k3s_bin
  when: k3s_manage | bool
  tags: [k3s]

- name: Install k3s (only when absent)
  ansible.builtin.shell:
    cmd: >-
      curl -sfL https://get.k3s.io
      | INSTALL_K3S_VERSION={{ k3s_version }} sh -s - {{ k3s_install_args }}
  when:
    - k3s_manage | bool
    - not _k3s_bin.stat.exists
  changed_when: true
  tags: [k3s]

- name: Ensure the k3s service is enabled and running
  ansible.builtin.systemd:
    name: "{{ k3s_service_name }}"
    enabled: true
    state: started
  when: k3s_manage | bool
  tags: [k3s]

- name: Read the running k3s version
  ansible.builtin.command:
    cmd: k3s --version
  register: _k3s_version_out
  changed_when: false
  failed_when: false
  when: k3s_manage | bool
  tags: [k3s]

# Read-only. Surfaces the lab's health in the provisioning log without the
# playbook taking any position on what should be running inside it.
- name: Read k3s node status
  ansible.builtin.command:
    cmd: k3s kubectl get nodes --no-headers
  register: _k3s_nodes
  changed_when: false
  failed_when: false
  when: k3s_manage | bool
  tags: [k3s]

- name: Report k3s state
  ansible.builtin.debug:
    msg:
      - "k3s: {{ (_k3s_version_out.stdout_lines | default([]) | first) | default('not installed') }}"
      - "nodes: {{ _k3s_nodes.stdout_lines | default(['unavailable']) }}"
  when: k3s_manage | bool
  tags: [k3s]

# ─────────────────────────────────────────────────────────────────────────────
# Throwaway cluster tooling
#
# Every download is a pinned release artefact. kind, k3d, kubectl and helm
# previously came from `install.sh` and `get-helm-3` piped from each project's
# `main` branch into bash as root — moving targets with no integrity check.
# ─────────────────────────────────────────────────────────────────────────────
- name: Install kind
  ansible.builtin.get_url:
    url: "https://kind.sigs.k8s.io/dl/v{{ kind_version }}/kind-linux-amd64"
    dest: /usr/local/bin/kind
    mode: "0755"
  when: k8s_tools_manage | bool
  tags: [k8s_tools]

- name: Install k3d
  ansible.builtin.get_url:
    url: "https://github.com/k3d-io/k3d/releases/download/v{{ k3d_version }}/k3d-linux-amd64"
    dest: /usr/local/bin/k3d
    mode: "0755"
  when: k8s_tools_manage | bool or k3d_manage | bool
  tags: [k8s_tools, k3d]

- name: Resolve the latest stable kubectl version
  ansible.builtin.uri:
    url: https://dl.k8s.io/release/stable.txt
    return_content: true
  register: _kubectl_stable
  when:
    - k8s_tools_manage | bool
    - kubectl_version == "stable"
  tags: [k8s_tools]

- name: Set the kubectl version fact
  ansible.builtin.set_fact:
    _kubectl_version: >-
      {{ _kubectl_stable.content | trim
         if kubectl_version == 'stable' else kubectl_version }}
  when: k8s_tools_manage | bool
  tags: [k8s_tools]

- name: Install kubectl
  ansible.builtin.get_url:
    url: "https://dl.k8s.io/release/{{ _kubectl_version }}/bin/linux/amd64/kubectl"
    dest: /usr/local/bin/kubectl
    mode: "0755"
  when: k8s_tools_manage | bool
  tags: [k8s_tools]

- name: Download the pinned helm release
  ansible.builtin.unarchive:
    src: "https://get.helm.sh/helm-v{{ helm_version }}-linux-amd64.tar.gz"
    dest: /tmp
    remote_src: true
    creates: "/tmp/linux-amd64/helm"
  when: k8s_tools_manage | bool
  tags: [k8s_tools]

- name: Install helm
  ansible.builtin.copy:
    src: /tmp/linux-amd64/helm
    dest: /usr/local/bin/helm
    remote_src: true
    owner: root
    group: root
    mode: "0755"
  when: k8s_tools_manage | bool
  tags: [k8s_tools]

- name: Report installed tool versions
  ansible.builtin.command:
    cmd: "{{ item }} version"
  loop:
    - kind
    - k3d
    - kubectl
    - helm
  changed_when: false
  failed_when: false
  register: _tool_versions
  when: k8s_tools_manage | bool
  tags: [k8s_tools]

- name: Show installed tool versions
  ansible.builtin.debug:
    msg: "{{ (item.stdout | default(item.stderr, true)) | truncate(160) }}"
  loop: "{{ _tool_versions.results | default([]) }}"
  loop_control:
    label: "{{ item.item | default('') }}"
  when: k8s_tools_manage | bool
  tags: [k8s_tools]

# ─────────────────────────────────────────────────────────────────────────────
# Backend lab: k3d clusters
#
# Runs last: cluster creation needs the k3d binary installed above, and Docker
# from the docker role.
# ─────────────────────────────────────────────────────────────────────────────
- name: Reconcile k3d clusters
  ansible.builtin.include_tasks: k3d-clusters.yml
  when: k3d_manage | bool
  tags: [k3d]
