---
vault_state: present
vault_version: 1.17.5
vault_arch: amd64
vault_user: vault
vault_group: vault
vault_install_dir: /opt/vault
vault_config_dir: /etc/vault.d
vault_config_path: "{{ vault_config_dir }}/vault.hcl"
vault_data_dir: /var/lib/vault
vault_bin_dir: /usr/local/bin
vault_bin_path: "{{ vault_bin_dir }}/vault"
vault_zip_name: "vault_{{ vault_version }}_linux_{{ vault_arch }}.zip"
vault_download_url: "https://releases.hashicorp.com/vault/{{ vault_version }}/{{ vault_zip_name }}"
vault_service_name: vault
vault_service_unit_path: "/etc/systemd/system/{{ vault_service_name }}.service"
vault_listen_address: 127.0.0.1
vault_listen_port: 8200
vault_api_addr: "http://{{ vault_listen_address }}:{{ vault_listen_port }}"
vault_cluster_addr: "http://{{ vault_listen_address }}:8201"
vault_ui_enabled: true
vault_disable_mlock: true
